[view.turing_activity_mix]
description = "Volume-weighted human/bot activity derived from real SwapVM fills; trade count is diagnostic only."

[view.turing_trades]
description = "HumanGated and Swapped events correlated by transaction and order hash, giving one auditable row per real trade."
