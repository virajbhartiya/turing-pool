schema_version = 1

[nest]
description = "Live World Chain Aqua and SwapVM activity priced directly from the canonical World AgentBook and indexed from mined settlement events."

[table.aqua__docked]
description = "A strategy was removed from the live Aqua deployment's virtual-balance namespace."
