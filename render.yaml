services:
  - type: web
    name: turing-pool
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: "8453"
      - key: RPC_URL
        sync: false
      - key: SUBGRAPH_URL
        sync: false
      - key: DEPLOYMENTS_JSON
        sync: false
