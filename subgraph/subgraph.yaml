specVersion: 1.0.0
description: Turing Pool - per-tier flow analytics for the AMM that prices personhood
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TuringPoolApp
    network: base
    source:
      address: "0x0000000000000000000000000000000000000000" # set via `pnpm configure <app-address>`
      abi: TuringPoolApp
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - TierStat
        - Human
      abis:
        - name: TuringPoolApp
          file: ./abis/TuringPoolApp.json
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Swapped(indexed bytes32,indexed address,indexed uint256,bool,address,address,uint256,uint256,uint256)
          handler: handleSwapped
      file: ./src/mapping.ts
  - kind: ethereum
    name: Aqua
    network: base
    source:
      address: "0x499943E74FB0cE105688beeE8Ef2ABec5D936d31" # real 1inch Aqua on Base
      abi: Aqua
      startBlock: 0
    context:
      appAddress:
        type: Bytes
        data: "0x0000000000000000000000000000000000000000" # set via `pnpm configure <app-address>`
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Strategy
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
      file: ./src/mapping.ts
